name: release

# Tag vX.Y.Z (= VERSION file = rust/Cargo.toml version) publishes AiProxy.Mcp.Sdk and AiProxy.Mcp.Sdk.AspNetCore to nuget.org and
# aiproxy-mcp-sdk to crates.io. Environment `sdk-release`: variable NUGET_USER (nuget.org trusted
# publishing, OIDC), secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to (run from a matching vX.Y.Z tag)
        type: choice
        options: [all, nuget, crates]
        default: all
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag, VERSION and Cargo.toml agree
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "::error::Run from a vX.Y.Z tag."; exit 1; }
          version="$(tr -d '\r\n' < VERSION)"
          crate="$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "::error::Tag $GITHUB_REF_NAME != VERSION $version"; exit 1; }
          test "$crate" = "$version" || { echo "::error::rust/Cargo.toml $crate != VERSION $version"; exit 1; }

  nuget:
    needs: validate
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'nuget'
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Exchange OIDC token for a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          dotnet test aiproxy-mcp-sdk.slnx -c Release
          dotnet test dotnet/AiProxy.Mcp.Sdk.Tests -c Release -p:SdkTargetFramework=netstandard2.0
          dotnet pack aiproxy-mcp-sdk.slnx -c Release -o nupkgs -p:Version="$version"
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  crates:
    needs: validate
    if: github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'crates'
    runs-on: ubuntu-latest
    environment: sdk-release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured; cannot publish to crates.io"
            exit 1
          fi
          cargo test --workspace --locked
          cargo publish -p aiproxy-mcp-sdk --locked
